name: Build GZDoom Android 2026 APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch: # Allows you to manually trigger the build

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive' # Vital for GZDoom C++ native engine dependencies

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android NDK
      uses: android-actions/setup-ndk@v1
      with:
        ndk-version: '25.2.9519653' # Ensures C++ native engine components compile smoothly

    - name: Make Gradle Executable
      run: chmod +x ./gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: GZDoom-Android-2026-APK
        path: app/build/outputs/apk
